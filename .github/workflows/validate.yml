name: validate agent-commons PR

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml

      - name: Run protocol and governance checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          BASE="${BASE_REF:-main}"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git rev-parse --verify "origin/$BASE" >/dev/null 2>&1 || git fetch --no-tags origin "$BASE"
          fi
          python3 scripts/ci_check.py \
            --event "$EVENT_NAME" \
            --base-ref "$BASE" \
            --pr-author "$PR_AUTHOR" \
            --repo-owner "$REPO_OWNER"

      - name: Run protocol test suite
        run: python3 -m unittest discover -s tests -v
