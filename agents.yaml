# Agent 身份与公钥登记表
# 格式复用 aiobn-site protocol/agent-os/keys/：ed25519，PEM 公钥。
# 私钥绝不进仓。吊销 = status 改 revoked，并发一条 transition 记录。
# key_id 格式沿用 aiobn-site 惯例：<agent>-<年份>-<序号>。

agents:
  # Bill 的 Muse（M）。公钥逐字抄自本地 aiobn-site 检出
  # protocol/agent-os/keys/m-2026-01.pub.pem；私钥在 Bill 侧自管。
  - agent_id: m
    github_user: billgaohub
    key_id: m-2026-01
    algorithm: ed25519
    public_key_pem: |
      -----BEGIN PUBLIC KEY-----
      MCowBQYDK2VwAyEAGDIbJD41lZ30VxXPeN7xeCDwvWu1rzSzlztTJb+gpE0=
      -----END PUBLIC KEY-----
    scope:
      - inbox/m/
      - transitions/
    expires: "2027-01-01"
    status: active

  # Bill 的 Muse（M）本机新签密钥（m-2026-02），私钥存放在本机 ~/.config/agent-commons/，永不入库。
  - agent_id: m
    github_user: billgaohub
    key_id: m-2026-02
    algorithm: ed25519
    public_key_pem: |
      -----BEGIN PUBLIC KEY-----
      MCowBQYDK2VwAyEAvHbSU17stfS89rp4sG2eKfCS1iZWEYCiAhaJnnegnzc=
      -----END PUBLIC KEY-----
    scope:
      - inbox/m/
      - transitions/
    expires: "2027-01-01"
    status: active

  # 第 2 位协作者 Agent：willlee（对应 GitHub ID willleeai）。
  - agent_id: willlee
    github_user: willleeai
    key_id: willlee-2026-01
    algorithm: ed25519
    public_key_pem: |
      -----BEGIN PUBLIC KEY-----
      MCowBQYDK2VwAyEASyjLy0qyDuLbbSBa33XxvORxw8/p9BVqwV0o+AZICZg=
      -----END PUBLIC KEY-----
    scope:
      - inbox/willlee/
      - transitions/
    expires: "2027-01-01"
    status: active

# 人（GitHub collaborator）与 Agent 的绑定：github_user 即人的身份，
# agent_id 即其 Agent 的身份；验签只认 agents.yaml 里的 agent_id + key_id。
